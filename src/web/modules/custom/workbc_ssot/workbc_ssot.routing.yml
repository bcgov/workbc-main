workbc_ssot.uploads:
  path: '/admin/config/workbc/ssot/upload'
  defaults:
    _title: 'SSoT: Upload Datasets'
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
  requirements:
    _permission: 'administer ssot settings'

workbc_ssot.lmmu:
  path: '/admin/config/workbc/ssot/lmmu'
  defaults:
    _title: 'SSoT: Labour Market Monthly Update'
    _form: '\Drupal\workbc_ssot\Form\SsotUploadLmmuForm'
  requirements:
    _permission: 'administer ssot settings'

workbc_ssot.refresh:
  path: '/admin/config/workbc/ssot/refresh'
  defaults:
    _title: 'SSoT: Refresh Datasets'
    _form: '\Drupal\workbc_ssot\Form\SsotRefreshForm'
  requirements:
    _permission: 'administer ssot settings'

workbc_ssot.industryprofile:
  path: '/admin/config/workbc/ssot/industry-profile'
  defaults:
    _title: 'SSoT: Industry Profile Update'
    _form: '\Drupal\workbc_ssot\Form\SsotUploadIndustryProfileForm'
  requirements:
    _permission: 'administer ssot settings'

workbc_ssot.lfs:
  path: '/admin/config/workbc/ssot/labour-force-survey'
  defaults:
    _title: 'SSoT: Labour Force Survey Update'
    _form: '\Drupal\workbc_ssot\Form\SsotUploadLabourForceSurveyForm'
  requirements:
    _permission: 'administer ssot settings'
